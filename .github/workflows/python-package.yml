# This workflow installs dependencies with uv, then runs lint, type-check, test and build.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Type check with pyright
      run: uv run pyright src tests

    - name: Test with pytest
      run: uv run pytest

    - name: Build package
      run: uv build

    - name: Verify py.typed is packaged
      run: unzip -l dist/*.whl | grep py.typed
