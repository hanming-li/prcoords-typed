# This workflow installs dependencies with uv, then runs lint, type-check, test and build.
# If the commit message is a version like v1.0.1, it also creates a GitHub Release.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # gh workflow run 需要 actions: write 权限
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --all-groups

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Type check with pyright
      run: uv run pyright src tests

    - name: Test with pytest
      run: uv run pytest

    - name: Build package
      run: uv build

    - name: Verify py.typed is packaged
      run: unzip -l dist/*.whl | grep py.typed

    - name: Create release from version commit
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        message="$(git log -1 --format=%s)"
        if [[ "$message" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          version="${BASH_REMATCH[0]}"
          echo "Creating release for $version"
          gh release create "$version" --title "$version" --generate-notes
        else
          echo "Commit message '$message' is not a version, skipping release"
        fi

    - name: Trigger publish workflow
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        message="$(git log -1 --format=%s)"
        if [[ "$message" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "Triggering publish workflow"
          gh workflow run python-publish.yml --ref master
        else
          echo "Not a version commit, skipping publish trigger"
        fi
